[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blackbox"
version = "0.1.0"
description = "A flight recorder for AI agents: tamper-evident recording of every input, output, tool call and reasoning step, with incident-investigation reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam" }]
keywords = ["ai", "agents", "observability", "audit", "llm", "flight-recorder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
]
# Zero required dependencies: the core recorder is pure stdlib.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.30"]          # also covers OpenRouter (OpenAI-compatible)
anthropic = ["anthropic>=0.30"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "openai>=1.30", "anthropic>=0.30",
       "google-genai>=1.0"]

[project.scripts]
blackbox = "agent_blackbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Report CSS/JS live as files next to the package and are inlined at render time.
[tool.setuptools.package-data]
agent_blackbox = ["assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
